name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Formatação (Spotless)
        run: ./mvnw -B spotless:check

      # verify roda testes unitários, ArchUnit, Testcontainers e o gate do JaCoCo
      - name: Build, testes e cobertura
        run: ./mvnw -B verify

      - name: Publica relatórios de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: "**/target/site/jacoco/"
          if-no-files-found: ignore
