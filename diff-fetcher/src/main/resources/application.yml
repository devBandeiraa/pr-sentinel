server:
  port: 8081

spring:
  application:
    name: diff-fetcher
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

github:
  app-id: ${GITHUB_APP_ID}
  private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:/run/secrets/github-app.pem}

diff:
  max-chunk-chars: 12000
  ignored-patterns:
    - "**/package-lock.json"
    - "**/yarn.lock"
    - "**/*.min.js"
    - "**/generated/**"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
