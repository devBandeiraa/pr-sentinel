server:
  port: 8086

spring:
  application:
    name: github-publisher
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 2

github:
  app-id: ${GITHUB_APP_ID}
  private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:/run/secrets/github-app.pem}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
