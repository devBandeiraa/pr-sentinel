server:
  port: 8086

spring:
  application:
    name: github-publisher
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 2

github:
  app-id: ${GITHUB_APP_ID}
  # Chave em PKCS#8, montada como secret do Docker — ver README e ADR-006.
  private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:/run/secrets/github-app.pem}
  api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}

publisher:
  # Ligado, veredito CHANGES_REQUESTED posta REQUEST_CHANGES e bloqueia o merge em
  # repositório com branch protection — e aí um falso positivo do LLM trava o time até
  # alguém dar dismiss na review do bot. Desligado por padrão (ADR-009).
  request-changes: ${PUBLISHER_REQUEST_CHANGES:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
